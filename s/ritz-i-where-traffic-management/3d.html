<!doctype html>

<head>

<title>小模型路口 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout：整頁 3D 場景，左上角標題與說明，右下角視角按鈕 */
:root{ --fg:#10202c; --muted:#3c5262; --chip:rgba(255,255,255,.8); --line:rgba(16,32,44,.18); --accent:#2360c4; --bg:#cfe8f7; color-scheme:light }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;flex-direction:column;gap:4px}
.hud h1{margin:0;font-size:clamp(18px,3vw,26px);font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.hud p{margin:0;color:var(--muted);font-size:13px;max-width:62ch}
.ctrl{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ctrl button{font:inherit;font-size:14px;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.ctrl button:hover{background:#fff}
.ctrl button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrl button:focus-visible{outline:2px solid #e3a008;outline-offset:2px}
.tip{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:12px;pointer-events:none}
</style>
</head>
<body>

<div id="app"></div>
<div class="hud">
  <h1>小模型路口 3D</h1>
<nav style="pointer-events:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:14px"><a href="./">← 智慧路口情境模擬</a></nav>
  <p>用紙箱房子、紙膠帶道路、玩具小汽車和透明壓克力架擺出的小路口。ReSpeaker 放在壓克力板正中央，藍牙喇叭綁在玩具救護車上移動。</p>
</div>
<div class="ctrl" id="ctrl"><button data-v="v1">斜上方</button><button data-v="v2">俯視</button><button data-v="v3">車子視角</button><button data-v="v4">ReSpeaker 特寫</button><button data-v="spin">自動旋轉：關</button></div>
<div class="tip">拖曳旋轉・滾輪或兩指縮放</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ================= 小模型路口 3D：紙箱房子＋紙膠帶道路＋玩具小汽車（1 單位＝1 cm） ================= */
function initModel3D(host){
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.domElement.style.cssText="width:100%;height:100%;display:block";
host.insertBefore(renderer.domElement,host.firstChild);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(42,1,1,5000);
const ctl=new THREE.OrbitControls(cam,renderer.domElement); ctl.enableDamping=true; ctl.maxPolarAngle=Math.PI*0.49; ctl.minDistance=20; ctl.maxDistance=400;
ctl.autoRotate=false; ctl.autoRotateSpeed=0.5;
function resize(){const r=host.getBoundingClientRect();if(!r.width||!r.height)return;renderer.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(host); resize();

/* ---------- 室內：木頭地板上的手作路口 ---------- */
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
scene.background=canvasTex(4,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"#e9e3d8");gr.addColorStop(1,"#cfc4b2");g.fillStyle=gr;g.fillRect(0,0,w,h)});
scene.fog=new THREE.Fog(0xddd4c6,380,900);
const clouds=[];
scene.add(new THREE.HemisphereLight(0xfffaf0,0x8a7a62,0.7));
const sun=new THREE.DirectionalLight(0xfff3dd,0.75); sun.position.set(-120,240,90); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-140,right:140,top:140,bottom:-140,near:10,far:700}); sun.shadow.bias=-0.0005; scene.add(sun);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0.02},o));
function box(w,h,d,mat,x,y,z,parent=scene,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y+h/2,z);m.castShadow=shadow;m.receiveShadow=true;parent.add(m);return m}
function cyl(r,h,mat,x,y,z,seg=16,parent=scene){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat);m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}

// 木頭地板
const wood=canvasTex(512,512,(g,w,h)=>{const C=["#c9a57a","#c29d72","#cfac82","#bf986c","#c7a276"];for(let i=0;i<8;i++){g.fillStyle=C[i%5];g.fillRect(0,i*64,w,64);g.fillStyle="rgba(0,0,0,.10)";g.fillRect(0,i*64,w,2);
  for(let k=0;k<7;k++){g.strokeStyle="rgba(90,60,30,.10)";g.beginPath();g.moveTo(0,i*64+6+k*8);g.bezierCurveTo(w*.3,i*64+2+k*8,w*.6,i*64+12+k*8,w,i*64+6+k*8);g.stroke()}
  g.fillStyle="rgba(0,0,0,.08)";g.fillRect((i*137)%w,i*64,2,64)}});
wood.wrapS=wood.wrapT=THREE.RepeatWrapping; wood.repeat.set(7,7);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshStandardMaterial({map:wood,roughness:0.7})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

/* ---------- 道路：黑色珍珠板＋紙膠帶畫線（寬 20 cm、長 230 cm） ---------- */
const L=100, RW=10, RL=115;
const board=new THREE.MeshStandardMaterial({color:0x2f3133,roughness:0.95});
box(2*RL,0.4,2*RW,board,0,0,0,scene,false); box(2*RW,0.4,2*RL,board,0,0,0,scene,false);
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const tapeW=new THREE.MeshStandardMaterial({color:0xf2eedf,roughness:0.9}), tapeY=new THREE.MeshStandardMaterial({color:0xf2c230,roughness:0.9}), tapeR=new THREE.MeshStandardMaterial({color:0xe23b3b,roughness:0.9});
// 一段紙膠帶：稍微歪一點、長短不一，看起來像手貼的
function tape(x,z,len,along,mat,w=1.5){const m=new THREE.Mesh(new THREE.BoxGeometry(along==="x"?len:w,0.08,along==="x"?w:len),mat);m.position.set(x+(rnd()-.5)*0.3,0.45,z+(rnd()-.5)*0.3);m.rotation.y=(rnd()-.5)*0.03;m.receiveShadow=true;scene.add(m);return m}
function tapeLine(a,b,fixed,along,mat,dash=0){ // a→b 沿著 x 或 z，一段約 18 cm 接起來
  let p=a;while(p<b){const seg=Math.min(b-p,dash||16+rnd()*4);const c=p+seg/2;along==="x"?tape(c,fixed,seg+0.6,"x",mat):tape(fixed,c,seg+0.6,"z",mat);p+=seg+(dash?dash*0.8:0)}}
const IN=RW+12; // 路口範圍（斑馬線外）
for(const s of [-1,1]){
  tapeLine(IN,RL-1,0,"x",tapeY,0); tapeLine(-80,-IN,0,"x",tapeY,0);         // 臺灣大道中線（黃，西邊還在貼）
  tapeLine(IN,RL-1,0,"z",tapeY,0); tapeLine(-RL+1,-IN,0,"z",tapeY,0);         // 惠中路中線
  tapeLine(-RL+1,-IN+2,s*(RW-1.2),"x",tapeW,0); tapeLine(IN-2,RL-1,s*(RW-1.2),"x",tapeW,0);   // 路邊白線
  tapeLine(-RL+1,-IN+2,s*(RW-1.2),"z",tapeW,0); tapeLine(IN-2,s>0?75:RL-1,s*(RW-1.2),"z",tapeW,0);
}
// 斑馬線（白膠帶一條一條）＋停止線
for(let i=-RW+1.6;i<RW-1;i+=2.6){tape(i,RW+5,6,"z",tapeW,1.4);tape(i,-RW-5,6,"z",tapeW,1.4);tape(RW+5,i,6,"x",tapeW,1.4);tape(-RW-5,i,6,"x",tapeW,1.4)}
tape(-RW/2,-RW-10,RW,"x",tapeW);tape(RW/2,RW+10,RW,"x",tapeW);tape(RW+10,-RW/2,RW,"z",tapeW);tape(-RW-10,RW/2,RW,"z",tapeW);
// 正在貼膠帶：一卷膠帶立在線的尾巴（拉出一段），旁邊放一把剪刀
function tapeRoll(x,z,axis,mat){const g=new THREE.Group();
  const prof=(r0,r1,h)=>[new THREE.Vector2(r0,-h/2),new THREE.Vector2(r1,-h/2),new THREE.Vector2(r1,h/2),new THREE.Vector2(r0,h/2),new THREE.Vector2(r0,-h/2)];
  const roll=new THREE.Mesh(new THREE.LatheGeometry(prof(2.6,4.2,1.5),48),mat);roll.castShadow=true;g.add(roll);
  const core=new THREE.Mesh(new THREE.LatheGeometry(prof(2.25,2.6,1.6),48),M(0xb98a55));g.add(core);
  g.rotation.set(axis==="x"?Math.PI/2:0,0,axis==="x"?0:Math.PI/2); // 輪子立起來，沿著線滾
  g.position.set(x,4.6,z);scene.add(g);return g}
function scissors(x,z,rot,hc){const g=new THREE.Group(),steel=M(0xc4c9cf,{metalness:0.75,roughness:0.28}),hm=M(hc,{roughness:0.5});
  for(const s of [-1,1]){const b=new THREE.Group();b.rotation.z=s*0.2;g.add(b);
    ext([[0,-0.5*s],[7.5,-0.05*s],[7.4,0.15*s],[0,0.45*s]],0.2,steel,0.04,b);
    const h=new THREE.Mesh(new THREE.TorusGeometry(1.25,0.42,10,24),hm);h.position.set(-2.3,1.0*s,0);h.castShadow=true;b.add(h);
    const n=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.5,0.5),hm);n.position.set(-0.7,0.45*s,0);b.add(n)}
  const pin=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.7,12),steel);pin.rotation.x=Math.PI/2;g.add(pin);
  g.rotation.set(-Math.PI/2,0,rot);g.position.set(x,0.85,z);scene.add(g);return g}
tapeRoll(-86,0,"x",tapeY); tape(-83,0,6,"x",tapeY); scissors(-90,9,0.6,0xe8483f);   // 黃色中線貼到一半
tapeRoll(RW-1.2,81,"z",tapeW); tape(RW-1.2,78,6,"z",tapeW); scissors(17,84,2.2,0x2f6fd6); // 白色邊線貼到一半

/* ---------- 透明壓克力架＋ReSpeaker ---------- */
const acrylic=new THREE.MeshPhysicalMaterial({color:0xdff3ff,transparent:true,opacity:0.28,roughness:0.05,metalness:0,clearcoat:1,clearcoatRoughness:0.05,depthWrite:false});
const acrylicEdge=new THREE.LineBasicMaterial({color:0x7fc4ee,transparent:true,opacity:0.95});
function acrylicBox(w,h,d,x,y,z){const g=new THREE.BoxGeometry(w,h,d);const m=new THREE.Mesh(g,acrylic);m.position.set(x,y+h/2,z);m.renderOrder=2;scene.add(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),acrylicEdge);e.position.copy(m.position);scene.add(e);return m}
for(const sx of [-1,1]) for(const sz of [-1,1]) acrylicBox(2,24.4,2,sx*14,0.6,sz*14);
acrylicBox(32,0.6,32,0,25,0);
cyl(9.5,3.2,M(0x1c1d20,{roughness:0.45}),0,25.6,0,64); cyl(9.7,0.6,M(0x0e0f11,{roughness:0.5}),0,25.6,0,64);
const sticker=canvasTex(256,256,(g)=>{g.fillStyle="#1c1d20";g.beginPath();g.arc(128,128,100,0,7);g.fill();g.strokeStyle="#ddd";g.lineWidth=3;g.beginPath();g.arc(128,128,96,0,7);g.stroke();
  for(let d=0;d<360;d+=10){const a=(d-90)*Math.PI/180,r0=d%30?88:80;g.strokeStyle="#ddd";g.lineWidth=d%30?1:2;g.beginPath();g.moveTo(128+Math.cos(a)*r0,128+Math.sin(a)*r0);g.lineTo(128+Math.cos(a)*96,128+Math.sin(a)*96);g.stroke()}
  g.textAlign="center";g.textBaseline="middle";
  [45,135,225,315].forEach((d,k)=>{const a=(d-90)*Math.PI/180,x=128+Math.cos(a)*48,y=128+Math.sin(a)*48;g.save();g.translate(x,y);g.rotate((d+180)*Math.PI/180);g.beginPath();g.arc(0,0,17,0,7);g.fillStyle="#fff";g.fill();g.lineWidth=2.5;g.strokeStyle="#111";g.stroke();g.fillStyle="#111";g.font="bold 22px sans-serif";g.fillText(String(k+1),0,1);g.restore()});
  [[0,"0°"],[90,"90°"],[180,"180°"],[270,"270°"]].forEach(([d,t])=>{const a=(d-90)*Math.PI/180;g.save();g.translate(128+Math.cos(a)*68,128+Math.sin(a)*68);g.rotate((d+180)*Math.PI/180);g.font="bold 15px sans-serif";g.fillStyle="#eee";g.fillText(t,0,0);g.restore()})});
const st=new THREE.Mesh(new THREE.CircleGeometry(11,64),new THREE.MeshBasicMaterial({map:sticker,transparent:true})); st.rotation.x=-Math.PI/2; st.position.set(0,28.85,0); scene.add(st);
// USB 線：從 ReSpeaker 沿著壓克力柱下來，貼著路邊走到地上的 MacBook
const usbCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,27.4,9.4),new THREE.Vector3(-4,26.6,12.8),new THREE.Vector3(-10,26,14),new THREE.Vector3(-14.6,22,14.6),new THREE.Vector3(-14.8,6,14.8),new THREE.Vector3(-15.5,0.4,17),
  new THREE.Vector3(-16.5,0.4,32),new THREE.Vector3(-17,0.4,44),new THREE.Vector3(-24,0.4,50),new THREE.Vector3(-36,0.4,47),new THREE.Vector3(-44,0.6,46)]);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(usbCurve,120,0.3,8),M(0x222222)));
/* ---------- 筆電（放在地上，螢幕朝孩子這邊，畫面是頻率雷達） ---------- */
{const lap=new THREE.Group();lap.position.set(-58,0,54);lap.rotation.y=Math.PI/4;scene.add(lap);
 const alu=new THREE.MeshStandardMaterial({color:0xc9ccd1,metalness:0.6,roughness:0.35});
 const base=new THREE.Mesh(new THREE.BoxGeometry(30,1.2,21),alu);base.position.y=0.6;base.castShadow=base.receiveShadow=true;lap.add(base);
 const kb=new THREE.Mesh(new THREE.PlaneGeometry(26,9),M(0x1e2126,{roughness:0.6}));kb.rotation.x=-Math.PI/2;kb.position.set(0,1.22,-1.5);lap.add(kb);
 const pad=new THREE.Mesh(new THREE.PlaneGeometry(11,6.5),M(0xb9bdc3,{roughness:0.4}));pad.rotation.x=-Math.PI/2;pad.position.set(0,1.22,6.2);lap.add(pad);
 const lid=new THREE.Group();lid.position.set(0,1.2,-10.4);lid.rotation.x=-0.32;lap.add(lid);  // 螢幕往後仰
 const back=new THREE.Mesh(new THREE.BoxGeometry(30,20,0.6),alu);back.position.set(0,10,0);back.castShadow=true;lid.add(back);
 const scr=canvasTex(512,340,(g,W,H)=>{g.fillStyle="#0f1424";g.fillRect(0,0,W,H);g.fillStyle="#e8ebf2";g.font="bold 26px 'Noto Sans TC',sans-serif";g.fillText("頻率雷達",20,38);
   const cx=W/2,cy=H/2+20,R=120;for(let r=40;r<=R;r+=40){g.strokeStyle="rgba(150,180,255,.45)";g.lineWidth=2;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke()}
   g.fillStyle="rgba(255,80,70,.55)";g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,-0.35-Math.PI/2+0.9,0.35-Math.PI/2+0.9);g.closePath();g.fill();
   g.strokeStyle="#ff5a4a";g.lineWidth=5;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(-Math.PI/2+0.9)*R,cy+Math.sin(-Math.PI/2+0.9)*R);g.stroke();
   g.fillStyle="#9ba5b7";g.font="18px sans-serif";g.textAlign="center";g.fillText("0°",cx,cy-R-8);g.fillText("90°",cx+R+22,cy+6)});
 const sm=new THREE.Mesh(new THREE.PlaneGeometry(27.5,17.5),new THREE.MeshBasicMaterial({map:scr}));sm.position.set(0,10.3,0.31);lid.add(sm);
 // 斜放在西南角，螢幕朝向路口和觀看的人
}

/* ---------- 紅綠燈（玩具紅綠燈：站在路口轉角，燈頭伸到車道上方） ---------- */
const SIGS=[];
function signal(px,pz,hx,hz,axis,face){
  const pm=M(0x6b737a,{metalness:0.5,roughness:0.4});
  cyl(0.6,16,pm,px,0,pz,12); cyl(1.6,0.6,M(0x3a3f44),px,0,pz,16);
  const hor=Math.abs(hx-px)>0.1, len=Math.hypot(hx-px,hz-pz)+2;
  box(hor?len:0.5,0.5,hor?0.5:len,pm,(px+hx)/2,15.6,(pz+hz)/2);
  box(hor?5.4:1.8,1.8,hor?1.8:5.4,M(0x1d2124),hx,12.8,hz);
  const lamps=["red","yellow","green"].map((c,i)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(0.62,14,12),new THREE.MeshStandardMaterial({color:0x2a2f33}));
    const k=i-1; m.position.set(hx+(hor?k*1.6:0)+face[0],13.7,hz+(hor?0:k*1.6)+face[1]); scene.add(m); const m2=new THREE.Mesh(m.geometry,m.material); m2.position.set(hx+(hor?k*1.6:0)-face[0],13.7,hz+(hor?0:k*1.6)-face[1]); scene.add(m2); return {m,c}});
  SIGS.push({axis,lamps});
}
signal(-24,RW+3,-24,5,"EW",[-0.95,0]); signal(24,-RW-3,24,-5,"EW",[0.95,0]); signal(-RW-3,-24,-5,-24,"NS",[0,-0.95]); signal(RW+3,24,5,24,"NS",[0,0.95]);
const LCOL={red:0xff3b30,yellow:0xffc21a,green:0x2ee07c};
function lightsAt(t){const c=t%20; const ew=c<7?"green":c<9?"yellow":"red", ns=c<10?"red":c<17?"green":c<19?"yellow":"red"; return {EW:ew,NS:ns}}
function updSignals(t){const S=lightsAt(t);for(const s of SIGS){for(const {m,c} of s.lamps){const on=S[s.axis]===c;m.material.color.setHex(on?LCOL[c]:0x2a2f33);m.material.emissive.setHex(on?LCOL[c]:0);m.material.emissiveIntensity=on?1.6:0}}}

/* ================= 紙箱房子：瓦楞紙箱＋麥克筆畫窗戶＋膠帶 ================= */
function cardTex(w,h,opt={}){return canvasTex(256,Math.max(64,Math.round(256*h/w)),(g,W,H)=>{
  const base=opt.base||"#c79b68";g.fillStyle=base;g.fillRect(0,0,W,H);
  for(let x=0;x<W;x+=5){g.fillStyle=x%10?"rgba(255,255,255,.04)":"rgba(0,0,0,.05)";g.fillRect(x,0,2,H)}      // 瓦楞紋
  g.fillStyle="rgba(0,0,0,.06)";for(let i=0;i<40;i++){g.fillRect(Math.random()*W,Math.random()*H,2,2)}
  if(opt.win){const [cols,rows]=opt.win,mx=W*0.12,my=H*(opt.top||0.1),cw=(W-2*mx)/cols,rh=(H*(1-(opt.top||0.1))-my-(opt.doorH?H*opt.doorH:H*0.06))/rows;
    for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const x=mx+i*cw+cw*0.18,y=my+j*rh+rh*0.18,ww=cw*0.64,hh=rh*0.6;
      g.fillStyle=opt.glass||"#9cc7e8";g.fillRect(x,y,ww,hh);g.strokeStyle="#1d1d1d";g.lineWidth=3;g.lineJoin="round";
      g.beginPath();g.moveTo(x+Math.random()*2,y);g.lineTo(x+ww,y+Math.random()*2);g.lineTo(x+ww-Math.random()*2,y+hh);g.lineTo(x,y+hh-Math.random()*2);g.closePath();g.stroke();
      g.beginPath();g.moveTo(x+ww/2,y);g.lineTo(x+ww/2,y+hh);g.stroke()}}
