<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>小模型路口 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout：整頁 3D 場景，左上角標題與說明，右下角視角按鈕 */
:root{ --fg:#10202c; --muted:#3c5262; --chip:rgba(255,255,255,.8); --line:rgba(16,32,44,.18); --accent:#2360c4; --bg:#cfe8f7; color-scheme:light }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;flex-direction:column;gap:4px}
.hud h1{margin:0;font-size:clamp(18px,3vw,26px);font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.hud p{margin:0;color:var(--muted);font-size:13px;max-width:62ch}
.ctrl{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ctrl button{font:inherit;font-size:14px;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.ctrl button:hover{background:#fff}
.ctrl button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrl button:focus-visible{outline:2px solid #e3a008;outline-offset:2px}
.tip{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:12px;pointer-events:none}
</style>
</head>
<body>

<div id="app"></div>
<div class="hud">
  <h1>小模型路口 3D：臺灣大道 × 惠中路</h1>
<nav style="pointer-events:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:14px"><a href="./">← 智慧路口情境模擬</a></nav>
  <p>用玩具小汽車、積木房子和透明壓克力架擺出的小路口。ReSpeaker 放在壓克力板正中央（高 25 cm），紅圈是藍牙喇叭擺放位置（近 50 cm、遠 90 cm）。</p>
</div>
<div class="ctrl" id="ctrl"><button data-v="v1">斜上方</button><button data-v="v2">俯視</button><button data-v="v3">車子視角</button><button data-v="v4">ReSpeaker 特寫</button><button data-v="spin">自動旋轉：關</button></div>
<div class="tip">拖曳旋轉・滾輪或兩指縮放</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ================= 小模型路口 3D：玩具小汽車＋積木房子（1 單位＝1 cm） ================= */
function initModel3D(host){
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.domElement.style.cssText="width:100%;height:100%;display:block";
host.insertBefore(renderer.domElement,host.firstChild);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(42,1,1,5000);
const ctl=new THREE.OrbitControls(cam,renderer.domElement); ctl.enableDamping=true; ctl.maxPolarAngle=Math.PI*0.49; ctl.minDistance=20; ctl.maxDistance=700;
ctl.autoRotate=false; ctl.autoRotateSpeed=0.5;
function resize(){const r=host.getBoundingClientRect();if(!r.width||!r.height)return;renderer.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(host); resize();

/* ---------- 天空、光 ---------- */
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
scene.background=canvasTex(4,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"#3f8fd8");gr.addColorStop(0.55,"#8cc6ef");gr.addColorStop(1,"#e9f5fb");g.fillStyle=gr;g.fillRect(0,0,w,h)});
scene.fog=new THREE.Fog(0xcfe6f4,520,1500);
const cloudM=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:0.95});
function cloud(x,y,z,s){const g=new THREE.Group();[[0,0,0,1],[1.1,0.2,0.2,0.8],[-1.1,0.1,-0.1,0.75],[0.4,0.55,0,0.7],[-0.5,0.45,0.2,0.6]].forEach(([a,b,c,r])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),cloudM);m.position.set(a,b,c);g.add(m)});g.scale.setScalar(s);g.position.set(x,y,z);scene.add(g);return g}
const clouds=[cloud(-320,260,-520,42),cloud(240,300,-600,55),cloud(520,220,-160,38),cloud(-560,240,180,46),cloud(80,330,620,50),cloud(-160,280,-760,60)];
scene.add(new THREE.HemisphereLight(0xdcecff,0x6a7f5a,0.55));
const sun=new THREE.DirectionalLight(0xfff3dd,0.85); sun.position.set(-160,260,120); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-150,right:150,top:150,bottom:-150,near:10,far:800}); sun.shadow.bias=-0.0005; scene.add(sun);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0.02},o));
function box(w,h,d,mat,x,y,z,parent=scene,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y+h/2,z);m.castShadow=shadow;m.receiveShadow=true;parent.add(m);return m}
function cyl(r,h,mat,x,y,z,seg=16,parent=scene){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat);m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}

/* ---------- 地面、道路（像一張道路地墊） ---------- */
const L=100, RW=10, W2=2*L;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),M(0x6f9e5c)); ground.rotation.x=-Math.PI/2; ground.position.y=-0.05; ground.receiveShadow=true; scene.add(ground);
const sidewalk=M(0xc9bfae);
for(const sx of [-1,1]) for(const sz of [-1,1]) box(L-RW,0.6,L-RW,sidewalk,sx*(L+RW)/2,0,sz*(L+RW)/2,scene,false);
const asphalt=M(0x4b5156,{roughness:0.95});
box(W2+60,0.4,2*RW,asphalt,0,0,0,scene,false); box(2*RW,0.41,W2+60,asphalt,0,0,0,scene,false);
const white=M(0xf4f4ef), yellow=M(0xe7c13a);
for(const s of [-1,1]){ for(const [len,cx] of [[L-RW+30,(L+RW+30)/2],[L-RW+30,-(L+RW+30)/2]]){ box(len,0.06,0.45,white,cx,0.41,s*(RW-0.4),scene,false); box(0.45,0.06,len,white,s*(RW-0.4),0.41,cx,scene,false);} }
const med=M(0x5f9d4e);
for(const [w,d,x,z] of [[L-22+30,1.6,(L+22+30)/2,0],[L-22+30,1.6,-(L+22+30)/2,0],[1.6,L-22+30,0,(L+22+30)/2],[1.6,L-22+30,0,-(L+22+30)/2]]){ box(w,1,d,yellow,x,0.4,z); box(w-0.4,1.15,d-0.4,med,x,0.4,z); }
for(let i=-RW+1.2;i<RW-0.6;i+=2.3){ box(1.2,0.06,5,white,i,0.43,RW+4.5,scene,false); box(1.2,0.06,5,white,i,0.43,-RW-4.5,scene,false); box(5,0.06,1.2,white,RW+4.5,0.43,i,scene,false); box(5,0.06,1.2,white,-RW-4.5,0.43,i,scene,false); }
box(RW,0.06,0.6,white,-RW/2,0.44,-RW-8,scene,false); box(RW,0.06,0.6,white,RW/2,0.44,RW+8,scene,false); box(0.6,0.06,RW,white,RW+8,0.44,-RW/2,scene,false); box(0.6,0.06,RW,white,-RW-8,0.44,RW/2,scene,false);

/* ---------- 透明壓克力架＋ReSpeaker ---------- */
const acrylic=new THREE.MeshPhysicalMaterial({color:0xdff3ff,transparent:true,opacity:0.28,roughness:0.05,metalness:0,clearcoat:1,clearcoatRoughness:0.05,depthWrite:false});
const acrylicEdge=new THREE.LineBasicMaterial({color:0x7fc4ee,transparent:true,opacity:0.95});
function acrylicBox(w,h,d,x,y,z){const g=new THREE.BoxGeometry(w,h,d);const m=new THREE.Mesh(g,acrylic);m.position.set(x,y+h/2,z);m.renderOrder=2;scene.add(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),acrylicEdge);e.position.copy(m.position);scene.add(e);return m}
for(const sx of [-1,1]) for(const sz of [-1,1]) acrylicBox(2,24.4,2,sx*14,0.6,sz*14);
acrylicBox(32,0.6,32,0,25,0);
cyl(5,0.8,M(0x2f6fd6,{roughness:0.4}),0,25.6,0,40);
const sticker=canvasTex(256,256,(g)=>{g.fillStyle="#f5f7fa";g.beginPath();g.arc(128,128,100,0,7);g.fill();g.strokeStyle="#111";g.lineWidth=3;g.beginPath();g.arc(128,128,96,0,7);g.stroke();
  for(let d=0;d<360;d+=10){const a=(d-90)*Math.PI/180,r0=d%30?88:80;g.lineWidth=d%30?1:2;g.beginPath();g.moveTo(128+Math.cos(a)*r0,128+Math.sin(a)*r0);g.lineTo(128+Math.cos(a)*96,128+Math.sin(a)*96);g.stroke()}
  g.textAlign="center";g.textBaseline="middle";
  [45,135,225,315].forEach((d,k)=>{const a=(d-90)*Math.PI/180,x=128+Math.cos(a)*48,y=128+Math.sin(a)*48;g.save();g.translate(x,y);g.rotate((d+180)*Math.PI/180);g.beginPath();g.arc(0,0,17,0,7);g.fillStyle="#fff";g.fill();g.lineWidth=2.5;g.strokeStyle="#111";g.stroke();g.fillStyle="#111";g.font="bold 22px sans-serif";g.fillText(String(k+1),0,1);g.restore()});
  [[0,"0°"],[90,"90°"],[180,"180°"],[270,"270°"]].forEach(([d,t])=>{const a=(d-90)*Math.PI/180;g.save();g.translate(128+Math.cos(a)*68,128+Math.sin(a)*68);g.rotate((d+180)*Math.PI/180);g.font="bold 15px sans-serif";g.fillStyle="#111";g.fillText(t,0,0);g.restore()})});
const st=new THREE.Mesh(new THREE.CircleGeometry(5.8,48),new THREE.MeshBasicMaterial({map:sticker,transparent:true})); st.rotation.x=-Math.PI/2; st.position.set(0,26.45,0); scene.add(st);
const usbCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,26,4.8),new THREE.Vector3(0,26.4,12),new THREE.Vector3(8,26,15),new THREE.Vector3(14,12,16),new THREE.Vector3(18,0.8,19),new THREE.Vector3(19,0.8,40)]);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(usbCurve,60,0.25,8),M(0x222222)));

/* ---------- 紅綠燈（分隔島上的燈桿，燈頭在車道正上方，紅黃綠輪流變換） ---------- */
const SIGS=[];
function signal(px,pz,hx,hz,axis,face){
  const pm=M(0x6b737a,{metalness:0.5,roughness:0.4});
  cyl(0.6,16,pm,px,0.6,pz,12);
  const hor=Math.abs(hx-px)>0.1, len=Math.hypot(hx-px,hz-pz)+2;
  box(hor?len:0.5,0.5,hor?0.5:len,pm,(px+hx)/2,15.6,(pz+hz)/2);
  box(hor?5.4:1.8,1.8,hor?1.8:5.4,M(0x1d2124),hx,12.8,hz);
  const lamps=["red","yellow","green"].map((c,i)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(0.62,14,12),new THREE.MeshStandardMaterial({color:0x2a2f33}));
    const k=i-1; m.position.set(hx+(hor?k*1.6:0)+face[0],13.7,hz+(hor?0:k*1.6)+face[1]); scene.add(m); const m2=new THREE.Mesh(m.geometry,m.material); m2.position.set(hx+(hor?k*1.6:0)-face[0],13.7,hz+(hor?0:k*1.6)-face[1]); scene.add(m2); return {m,c}});
  SIGS.push({axis,lamps});
}
signal(0,-23,-6,-23,"NS",[0,-0.95]); signal(0,23,6,23,"NS",[0,0.95]); signal(23,0,23,-6,"EW",[0.95,0]); signal(-23,0,-23,6,"EW",[-0.95,0]);
const LCOL={red:0xff3b30,yellow:0xffc21a,green:0x2ee07c};
function lightsAt(t){const c=t%20; const ew=c<7?"green":c<9?"yellow":"red", ns=c<10?"red":c<17?"green":c<19?"yellow":"red"; return {EW:ew,NS:ns}}
function updSignals(t){const S=lightsAt(t);for(const s of SIGS){for(const {m,c} of s.lamps){const on=S[s.axis]===c;m.material.color.setHex(on?LCOL[c]:0x2a2f33);m.material.emissive.setHex(on?LCOL[c]:0);m.material.emissiveIntensity=on?1.6:0}}}

/* ================= 積木（大顆粒積木比例：顆粒間距 1.6 cm、一塊高 1.92 cm） ================= */
const P=1.6, BH=1.92, GAP=0.08, SR=0.5, SH=0.36, PLATE=0.64;
const MATS=new Map();
function mat(k){if(MATS.has(k))return MATS.get(k);let m;
  if(k==="glass") m=new THREE.MeshPhysicalMaterial({color:0xa9dcf5,transparent:true,opacity:0.55,roughness:0.05,clearcoat:1,clearcoatRoughness:0.05});
  else if(k==="water") m=new THREE.MeshPhysicalMaterial({color:0x3d9ad8,transparent:true,opacity:0.8,roughness:0.05,clearcoat:1});
  else m=new THREE.MeshPhysicalMaterial({color:k,roughness:0.3,metalness:0,clearcoat:0.7,clearcoatRoughness:0.2});
  MATS.set(k,m);return m}
const INST={brick:new Map(),stud:new Map(),round:new Map()};
const _q=new THREE.Quaternion(),_s=new THREE.Vector3(),_p=new THREE.Vector3();
function push(kind,col,x,y,z,sx,sy,sz){const m=INST[kind];if(!m.has(col))m.set(col,[]);m.get(col).push(new THREE.Matrix4().compose(_p.set(x,y,z),_q,_s.set(sx,sy,sz)))}
const brick=(col,x,y,z,sx,sy,sz)=>push("brick",col,x,y+sy/2,z,sx,sy,sz);   // y＝底面
const stud=(col,x,y,z)=>push("stud",col,x,y+SH/2,z,1,1,1);
const round=(col,x,y,z,r,h)=>push("round",col,x,y+h/2,z,2*r,h,2*r);
// 一片底板（含顆粒）；skip(i,j) 為 true 的格子不放顆粒（被房子蓋住）
function baseplate(col,x0,z0,nx,nz,skip=()=>false){brick(col,x0+nx*P/2,0.6,z0+nz*P/2,nx*P-0.1,0.32,nz*P-0.1);
  for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){if(!skip(x0+(i+0.5)*P,z0+(j+0.5)*P))stud(col,x0+(i+0.5)*P,0.92,z0+(j+0.5)*P)}}
const Y0=0.92;  // 底板上面
const FOOT=[];  // 房子佔用的範圍（不放顆粒）
const covered=(x,z)=>FOOT.some(([a,b,c,d])=>x>a&&x<c&&z>b&&z<d);
// 一棟積木房子：w×d 顆粒、rows 層。mask(face,s,r) 回傳 null＝牆、"glass"＝窗、"none"＝空、或顏色
function legoHouse({x0,z0,w,d,rows,wall,band=null,roof=0x9aa3a8,mask=()=>null,inner=0x34404a,y0=Y0,studsTop=true}){
  FOOT.push([x0,z0,x0+w*P,z0+d*P]);
  const F={"-z":{a:0,b:w,pos:s=>[x0+(s+0.5)*P,z0+0.5*P],ax:"x"},"+z":{a:0,b:w,pos:s=>[x0+(s+0.5)*P,z0+(d-0.5)*P],ax:"x"},
           "-x":{a:1,b:d-1,pos:s=>[x0+0.5*P,z0+(s+0.5)*P],ax:"z"},"+x":{a:1,b:d-1,pos:s=>[x0+(w-0.5)*P,z0+(s+0.5)*P],ax:"z"}};
  for(const [fk,f] of Object.entries(F)) for(let r=0;r<rows;r++){
    const y=y0+r*BH; let run=null;
    const emit=()=>{if(!run)return;const [x1,z1]=f.pos(run.s0),[x2,z2]=f.pos(run.s1),cx=(x1+x2)/2,cz=(z1+z2)/2,len=(run.s1-run.s0+1)*P-GAP;
      if(run.t==="none"){} else if(run.t==="glass") brick("glass",cx,y,cz,f.ax==="x"?len:0.35,BH-GAP,f.ax==="x"?0.35:len);
      else brick(run.t,cx,y,cz,f.ax==="x"?len:P-GAP,BH-GAP,f.ax==="x"?P-GAP:len); run=null};
    for(let s=f.a;s<f.b;s++){let t=mask(fk,s,r); if(t===null||t===undefined) t=(band!==null&&r%3===2)?band:wall;
      const brk=typeof t==="number"&&run&&run.t===t&&(((s+(r%2)*2)%4===0)||run.s1-run.s0>=3);
      if(!run||run.t!==t||brk){emit();run={t,s0:s,s1:s}} else run.s1=s}
    emit()}
  brick(inner,x0+w*P/2,y0,z0+d*P/2,(w-2)*P,rows*BH-0.2,(d-2)*P);
  const top=y0+rows*BH; brick(roof,x0+w*P/2,top,z0+d*P/2,w*P-GAP,PLATE,d*P-GAP);
  if(studsTop) for(let i=0;i<w;i++)for(let j=0;j<d;j++) stud(roof,x0+(i+0.5)*P,top+PLATE,z0+(j+0.5)*P);
  return top+PLATE}
// 積木樹：咖啡色圓柱樹幹＋三層綠色圓積木
function ltree(x,z,y=Y0,s=1){const G=[0x3e8e3a,0x4ea24a,0x2f7a33][Math.abs(Math.round(x*7+z*3))%3];
  round(0x7a4a26,x,y,z,0.75*s,2*BH*s); round(G,x,y+2*BH*s,z,2.7*s,BH*s); round(G,x,y+3*BH*s,z,2.0*s,BH*s); round(G,x,y+4*BH*s,z,1.25*s,BH*s); stud(G,x,y+5*BH*s,z)}
// 招牌（直立的店招，印字的積木片）
function signTex(text,bg,fg){return canvasTex(64,256,(g,w,h)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.strokeStyle="#fff";g.lineWidth=4;g.strokeRect(3,3,w-6,h-6);g.fillStyle=fg;g.font="bold 40px 'Noto Sans TC','PingFang TC',sans-serif";g.textAlign="center";
  const chars=[...text],step=h/(chars.length+0.5);chars.forEach((c,i)=>g.fillText(c,w/2,step*(i+1)+12))})}
function shopSign(text,bg,fg,x,y,z,alongX){const m=new THREE.Mesh(new THREE.BoxGeometry(alongX?0.5:P*1.0,BH*3.4,alongX?P*1.0:0.5),new THREE.MeshPhysicalMaterial({map:signTex(text,bg,fg),roughness:0.35,clearcoat:0.6}));
  m.position.set(x,y,z);m.castShadow=true;scene.add(m)}

/* ---------- 東北街廓：三間透天店面＋公寓（灰色底板） ---------- */
{ const x0=24,z0=-98;
  const shops=[[8,10,13,0xf2e6c9,0xffffff,["早餐店","#e8483f","#fff"]],[8,10,16,0xbcd9ea,0xffffff,["珍珠奶茶","#7b4a2a","#ffe9b0"]],[8,10,11,0xf4c9bd,0xffffff,["牛肉麵","#f2b134","#7a1c10"]]];
  let x=26;
  shops.forEach(([w,d,rows,wall,band,sg],k)=>{const zz=-20-d*P;
    const top=legoHouse({x0:x,z0:zz,w,d,rows,wall,band,roof:0xa7adb0,mask:(f,s,r)=>{
      if(f==="+z"){ if(r<2) return (s===0||s===w-1)?0xe9e2d4:(r===1&&s>2&&s<5?"none":"glass");
                    if(r%3!==2&&s>=2&&s<=5) return "glass"}
      if((f==="-x"||f==="+x")&&r%3===0&&r>2&&s>=3&&s<=6) return "glass";
      return null}});
    brick(0xe8483f,x+w*P/2,Y0+2*BH,-20+0.6,w*P,0.5,1.4);  // 騎樓上的遮雨棚
    shopSign(sg[0],sg[1],sg[2],x+w*P-0.8,Y0+4*BH+3,-20+1.5,true);

  waves.forEach(w=>{const p=(t*0.35+w.userData.ph)%1,r=4+p*90;w.scale.set(r,1,r);w.material.opacity=0.8*(1-p)});
  const on=Math.floor(t*6)%2; lbR.material.emissiveIntensity=on?2:0.2; lbB.material.emissiveIntensity=on?0.2:2;
  clouds.forEach((c,i)=>{c.position.x+=0.03*(i%2?1:-1)});
  updSignals(t); ctl.update(); renderer.render(scene,cam)}
tick();
return {cam,ctl,go, spin(v){ctl.autoRotate=v===undefined?!ctl.autoRotate:v;return ctl.autoRotate}, setActive(v){active=v;if(v)resize()}};
}

const model=initModel3D(document.getElementById("app"));
document.getElementById("ctrl").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.v==="spin"){const on=model.spin();b.textContent="自動旋轉："+(on?"開":"關");b.classList.toggle("on",on)} else model.go(b.dataset.v)});
</script>

</body>
